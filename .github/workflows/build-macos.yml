name: Build macOS

# Manual only. This repository has no upstream release pipeline, and the goal
# here is one reproducible unsigned macOS bundle to hand to testers.
#
# The output is unsigned and not notarized, so macOS quarantines it on first
# open. Testers clear that with the command in the run summary.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release to attach the DMG to. Leave empty to only keep the build artifact.
        required: false
        default: v1.9.11

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal (unsigned)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      SQLX_OFFLINE: 'true'
      # The Blockbench skin editor lives in a private submodule this checkout
      # cannot fetch. The bundle reuses the resources committed under
      # apps/app/resources/blockbench-skin instead.
      AXOLOTL_SKIP_BLOCKBENCH_BUILD: '1'
      # Lets the DMG bundler run on a runner without a GUI session.
      TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: terminus-macos-unsigned

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # git on Windows does not record the executable bit, so the wrapper can
      # arrive without it and app-lib's build script then dies with
      # "Failed to wait on Gradle build: Permission denied".
      - name: Make the Gradle wrapper executable
        run: chmod +x packages/app-lib/java/gradlew

      - name: Show the JDKs Gradle can pick from
        run: /usr/libexec/java_home -V 2>&1 || true

      - name: Build the universal bundle
        run: pnpm --filter @modrinth/app tauri build --target universal-apple-darwin

      # A bundle named "universal" is not proof that both slices are in it, so
      # check the Mach-O header before shipping it.
      - name: Verify the binary is really universal
        run: |
          app="target/universal-apple-darwin/release/bundle/macos/Terminus Launcher.app"
          binary="$app/Contents/MacOS/Terminus Launcher"
          ls -l "$app/Contents/MacOS/"
          archs="$(lipo -archs "$binary")"
          echo "architectures: $archs"
          case "$archs" in
            *x86_64*) ;;
            *) echo "x86_64 slice is missing" >&2; exit 1 ;;
          esac
          case "$archs" in
            *arm64*) ;;
            *) echo "arm64 slice is missing" >&2; exit 1 ;;
          esac
          codesign -dv --verbose=2 "$app" 2>&1 || echo "(not signed, as expected)"
          ls -l target/universal-apple-darwin/release/bundle/dmg/

      - name: Upload the DMG as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminus-macos-universal-unsigned
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      # Build artifacts need a GitHub login to download, which testers do not
      # have, so publish the DMG as a release asset as well. The name says
      # "unsigned" on purpose: nothing here is notarized.
      - name: Attach the DMG to a release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          dmg=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#dmg[@]} -ne 1 ]; then
            echo "expected exactly one DMG, found ${#dmg[@]}" >&2
            exit 1
          fi
          version="${TAG#v}"
          asset="TerminusLauncher_${version}_macos_universal_unsigned.dmg"
          cp "${dmg[0]}" "$asset"
          gh release upload "$TAG" "$asset" --clobber
          echo "uploaded $asset to $TAG"

      - name: Summarize
        run: |
          {
            echo "### macOS build"
            echo ""
            echo "The DMG is unsigned. Testers must clear the quarantine flag once:"
            echo ""
            echo '```'
            echo 'xattr -dr com.apple.quarantine "/Applications/Terminus Launcher.app"'
            echo '```'
            echo ""
            echo "Or right-click the app and choose Open the first time."
          } >> "$GITHUB_STEP_SUMMARY"
